<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click to Start Video</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #overlay {
        position: absolute;
        color: white;
        font-size: 24px;
        text-align: center;
        cursor: pointer;
        z-index: 2;
    }

    /* 4:3 responsive video container */
    .video-wrapper {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 4 / 3;
        background: black;
    }

    video {
        width: 100%;
        height: 100%;
        display: none;
    }
</style>
</head>

<body>

<div id="overlay">Click anywhere to start</div>

<div class="video-wrapper">
    <video id="video" playsinline controls>
        <source src="1224.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<script>
    const overlay = document.getElementById("overlay");
    const video = document.getElementById("video");

    document.addEventListener("click", () => {
        overlay.style.display = "none";
        video.style.display = "block";
        video.play();
    }, { once: true });
</script>

</body>
</html>
